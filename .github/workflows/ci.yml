# CI for Godwit: fmt, clippy and tests on every push and pull request.
# The same checks are the local gate (AGENTS.md); CI only repeats them.
name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      # The Debian/Ubuntu row of README's build table.
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang nasm libglib2.0-dev libasound2-dev \
            libva-dev libxkbcommon-dev libgtk-3-dev libwebkit2gtk-4.1-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
