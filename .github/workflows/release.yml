# Builds the release binaries for a pushed vX.Y.Z tag with tools/release.sh
# (the same container release.sh uses locally), checks dist/ (signatures,
# xz copies, checksums) and publishes the release.
#
# Needs one repository secret:
#   GODWIT_SIGNING_KEY  the Ed25519 private key (PEM); without it the binaries
#                       aren't signed and installed copies can't self-update.
name: Release

on:
  push:
    tags: ['v*']

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - name: Write the signing key (GODWIT_SIGNING_KEY)
        env:
          GODWIT_SIGNING_KEY: ${{ secrets.GODWIT_SIGNING_KEY }}
        run: |
          if [ -z "$GODWIT_SIGNING_KEY" ]; then
              echo "set the GODWIT_SIGNING_KEY repository secret (the Ed25519 private key, PEM)" >&2
              exit 1
          fi
          printf '%s' "$GODWIT_SIGNING_KEY" > "$HOME/godwit-signing.pem"
      # Cargo's downloads (LiveKit's prebuilt libwebrtc alone is a few hundred
      # MB); the build itself runs in a fresh container each time.
      - name: Cache downloads
        uses: actions/cache@v4
        with:
          path: |
            .build-cache/registry
            .build-cache/git
          key: godwit-${{ runner.os }}-${{ hashFiles('Cargo.lock', 'tools/build/Dockerfile') }}
          restore-keys: godwit-${{ runner.os }}-
      - name: Build (tools/release.sh, in its container)
        env:
          GODWIT_JOBS: '4'
        run: |
          export GODWIT_SIGNING_KEY="$HOME/godwit-signing.pem"
          tools/release.sh --container
      # Installed copies update themselves from the latest release, so nothing
      # is published unless every file checks out.
      - name: Check the release files
        run: |
          set -euo pipefail
          cd dist
          openssl pkey -in "$HOME/godwit-signing.pem" -pubout -out "$RUNNER_TEMP/update-key.pem"
          for f in godwit-linux-x86_64 godwit-windows-x86_64.exe; do
              test -s "$f"
              test -s "$f.sig"
              python3 -c 'import sys; sys.stdout.buffer.write(bytes.fromhex(open(sys.argv[1]).read().strip()))' "$f.sig" >"$RUNNER_TEMP/$f.sig.bin"
              openssl pkeyutl -verify -pubin -inkey "$RUNNER_TEMP/update-key.pem" -rawin \
                  -in "$f" -sigfile "$RUNNER_TEMP/$f.sig.bin"
              xz -t "$f.xz"
              xz -dc "$f.xz" | cmp - "$f"
          done
          file godwit-linux-x86_64 | grep -q 'ELF 64-bit'
          file godwit-windows-x86_64.exe | grep -q 'PE32+'
          sha256sum -c SHA256SUMS
      - name: Publish the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --latest --title "Godwit $TAG" --generate-notes dist/*
