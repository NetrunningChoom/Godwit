[package]
name = "godwit-teams"
description = "Godwit's Microsoft Teams network: device-code sign-in, chats and team channels over Teams' own chat service and its push connection (Trouter)."
version.workspace = true
edition.workspace = true
license.workspace = true

# Every dependency here was already in Godwit's lock file when this crate was
# added (2026-11-04), so it brings no new third-party code; see the security
# notes in docs/teams.md.
[dependencies]
godwit-core.workspace = true
godwit-secrets.workspace = true
anyhow.workspace = true
base64 = "0.22"
chrono.workspace = true
# Trouter's request bodies may be gzip + base64.
flate2 = "1.1"
futures-util.workspace = true
rand = "0.9"
reqwest.workspace = true
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-tungstenite.workspace = true

[dev-dependencies]
godwit-secrets = { workspace = true, features = ["test-support"] }

[lints]
workspace = true
