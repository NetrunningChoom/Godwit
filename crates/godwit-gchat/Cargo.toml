[package]
name = "godwit-gchat"
description = "Godwit's Google Chat network, as its web client: sign-in through Google's own page, the web client's cookies and request signing."
version.workspace = true
edition.workspace = true
license.workspace = true

# Every dependency here was already in Godwit's lock file when this crate was
# added (2026-11-04): no new third-party code (see docs/gchat.md).
[dependencies]
godwit-core.workspace = true
anyhow.workspace = true
base64 = "0.22"
protobuf = "=3.5.1"
reqwest = { workspace = true, features = ["form"] }
ring = "0.17"
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[build-dependencies]
protobuf = "=3.5.1"
protobuf-parse = "=3.5.1"
protobuf-codegen = "=3.5.1"

[lints]
workspace = true
