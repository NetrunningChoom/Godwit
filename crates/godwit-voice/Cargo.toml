[package]
name = "godwit-voice"
description = "Voice and video calls over LiveKit, with the official Stoat client's microphone processing."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
async-trait = "0.1"
cpal.workspace = true
futures-executor.workspace = true
futures-util.workspace = true
livekit.workspace = true
# LiveKit's transport traits, to open the signalling socket IPv4 first
# (see transport.rs). The version livekit already uses.
livekit-net = { version = "0.1.4", features = ["native"] }
http = "1"
nnnoiseless.workspace = true
nokhwa.workspace = true
serde.workspace = true
symphonia.workspace = true
tokio = { workspace = true, features = ["net"] }
tokio-tungstenite.workspace = true
url = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# PulseAudio (PipeWire) on Linux, so cpal sees the same device names as
# WebRTC's audio device module.
cpal = { workspace = true, features = ["pulseaudio"] }
# Screen-share sound (stream_audio): per-app record streams over the Pulse
# protocol, which PipeWire serves too. The same pure-Rust client cpal uses.
pulseaudio = "0.3"

[target.'cfg(windows)'.dependencies]
# Screen-share sound (stream_audio): WASAPI process loopback.
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_System_Variant",
] }
# #[implement] (the loopback's completion handler) names it directly.
windows-core = "0.61"

[lints]
workspace = true
